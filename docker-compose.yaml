services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  listener:
    build: ./listener
    restart: always
    env_file:
      - .env
    depends_on:
      - redis
  flask:
    build: ./flask
    restart: always
    ports:
      - "5001:5001"
    env_file:
      - .env
    depends_on:
      - redis

