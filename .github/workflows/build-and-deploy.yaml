name: Build and Deploy

on:
  [workflow_dispatch]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3
      - name: checkout chudfish-common
        uses: actions/checkout@v3
        with:
          repository: rnimnicht/chudfish-common
          token: ${{ secrets.CHUDFISH_COMMON_TOKEN }}
          path: chudfish-common
      - name: login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/chudfish:listener-latest --build-context common=chudfish-common -f listener/Dockerfile .
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/chudfish:metricclient-latest --build-context common=chudfish-common -f metricclient/Dockerfile .
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/chudfish:trader-latest --build-context common=chudfish-common -f trader/Dockerfile .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/chudfish:listener-latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/chudfish:metricclient-latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/chudfish:trader-latest