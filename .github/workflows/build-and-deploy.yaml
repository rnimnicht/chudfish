name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:

      - name: checkout
      - uses: actions/checkout@v3

      - name: login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/chudfish:listener-latest -f listener/Dockerfile .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/chudfish:listener-latest